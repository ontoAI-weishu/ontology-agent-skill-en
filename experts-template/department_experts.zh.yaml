# ════════════════════════════════════════════════════════════════
# 三、建团生成规则
# ════════════════════════════════════════════════════════════════
generation:
  per_department_role: experts          # 绑定 roles.yaml 的 experts（作用域限定本部门）
  naming: "{dept_name}专家"             # 显示名，如「财税专家」（挂在团队包下，自动命名空间隔离）
  team_naming: "{short_name}·本体论智能体数字公司"   # 团队包显示名（2026-08-15 拍板，替代"专家团"）
  memory_paths: ["department/{code}/inbox", "department/{code}/knowledge"]
  audit: per_action
  report_to: owner
  instruction: "用户说『按这个搭专家团』时，读取本模板 + 用户确认的部门清单（默认 12 核心，可选启用更多）+ instance 的 D/E/F 三层，逐部门生成专家并汇报 owner。"
  customization: >
    用户可在私有 instance.yaml 中覆盖：department_aliases(改名) / department_genders(指定性别) /
    custom_departments(新增私有部门) / disabled_departments(停用部门)。这些改动只存于 company-data，
    不修改本技能包，保证技能包整体性不被破坏。详见 references/customization.md。
