# 状态：stub（暂未实现）。为 Phase 6 企业客户出现时填充真实现。

meta:
  connector: feishu
  status: stub
  trigger: "出现企业客户、需接入真实人员与 IM 时填充实现"

integration:
  type: bot_webhook           # 飞书机器人 / 应用
  app_id_env: FEISHU_APP_ID
  app_secret_env: FEISHU_APP_SECRET
  message_types: [text, post, interactive]

bindings:
  - role: employee
    scope: "department/{dept}/shared"
  - event: task_assigned
  - event: approval_request

note: >
  飞书的开放平台 bot 与通讯录 API 对接，员工身份映射为 employee role；
  与 dingtalk.yaml / wecom.yaml 同契约、不同实现细节。
