# Logic Layer - Authoritative Department/Action Catalog (deduplicated & merged)
# ENGLISH EDITION. The original Chinese edition is preserved verbatim at `department_actions.zh.yaml`.
# Bilingual policy (中英文皆可适配): default `.yaml` files are English; `.zh.yaml` files are the
# Chinese originals. Machine keys (slug / source / department code) are IDENTICAL across both
# editions so that all scripts keep working regardless of language.
#
# Main axis: OPB-Skills (chendongqi, MIT, 91 skills / 24 departments, most complete)
# Complementary: Frog1205 (legal-dense) / slavingia (startup growth) / ReScienceLab (SEO, social, brand)
#                / sober568 (OPC five-stage diagnostics)
# Workflow thinking: easychen (CC-BY-NC-SA) - its licence does not require attribution or inclusion here
# Source codes (internal provenance, development-time only):
#   OPB  = chendongqi/OPB-Skills
#   Frog = Frog1205/OPC-Skills
#   slav = slavingia/skills
#   ReS  = ReScienceLab/opc-skills
#   sober= sober568/opc-zhinao
#   easy = easychen/opc-methodology (used under CC-BY-NC-SA)
#   WSHU = original extension by Tianjin Weishu AI Technology Co., Ltd. (24-department extensions; registered IP increment)
# Fields: slug (EN machine id) / name (EN display name) / source (source code) / note (optional)

meta:
  version: 0.2.0
  department_count: 24
  action_total: 177
  principle: Curated breadth (deduplicated union of authoritative actions per department), not a dump of 90+ raw files
  note: 12 core departments = 141 actions; the action layer for the 12 optional departments was completed on 2026-08-15 (6 departments reuse core actions, 6 departments add 18 original WSHU extension actions), totaling 177 action bindings over 159 unique action_specs. Fixes an earlier bug where tools_ref pointed at non-existent sections, leaving optional-department experts with zero capabilities.

