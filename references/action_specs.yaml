    outputs: [Plan, Milestones]
    uses_entities: [Goal, Task]
    skill_ref: OPB/skills/personal-growth-planning-assistant
  personal-talent-discovery:
    name: Talent Discovery Advisor
    source: OPB
    desc: >-
      Talent and strength discovery advisor. Through 10 carefully designed deep questions, asked one
      at a time, it guides the user to uncover hidden talents and strengths, collects concrete
      examples, distinguishes genuine passion from merely learned skills, and finally delivers a
      precise analysis of the user's strong domains plus monetization advice. Use when (1) the user
      wants to discover hidden talents, (2) needs clarity on career direction and advantage areas,
      (3) is looking for ways to monetize personal strengths, (4) wants to separate hobbies from
      true areas of mastery. Trigger words: talent discovery, strength mining, advantage analysis,
      capability assessment, career positioning, monetization advice.
