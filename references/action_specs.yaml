# Action Specs - ENGLISH EDITION
# The original Chinese edition is preserved verbatim at `action_specs.zh.yaml`.
# Bilingual policy (中英文皆可适配): default `.yaml` is English, `.zh.yaml` is the Chinese original.
# MACHINE KEYS ARE IDENTICAL ACROSS BOTH EDITIONS: action slug, `source` code, `uses_entities`
# type names, `skill_ref` paths, and the `industry_specific` / `derived` flags. Only the
# human-facing fields (`name`, `desc`, `inputs`, `outputs`) are translated.
#
# Provenance codes (development-time only):
#   OPB  = chendongqi/OPB-Skills (MIT)   Frog = Frog1205/OPC-Skills   slav = slavingia/skills
#   ReS  = ReScienceLab/opc-skills       sober= sober568/opc-zhinao
#   easy = easychen/opc-methodology (CC-BY-NC-SA; conceptual inspiration only, own expression)
#   WSHU = original extensions by Tianjin Weishu AI Technology Co., Ltd. (registered IP increment)

meta:
  generated_by: gen_action_specs.py
  total: 159
  opb_real_covered: 75
  note: >-
    On 2026-08-15, 18 original extension actions for the 24-department model were added
    (WSHU; 3 each for procurement / investor / csm / international / risk / it_security),
    taking the total from 141 to 159.

actions:
  strategic-startup-mentor:
    name: Startup Mentor
    source: OPB
    desc: >-
      Use when the user needs startup mentoring, business-model consulting, fundraising advice,
      team-building guidance, product-strategy planning, or help with challenges encountered while
      starting up. Covers (1) business-model and monetization design, (2) fundraising preparation
      and investor communication, (3) product iteration and user retention, (4) team management and
      partner relations, (5) market positioning and growth strategy, (6) one-person-company
      methodology. Trigger words: startup mentoring, business model, fundraising, team management,
      product strategy, user retention, one-person company.
    inputs: [Startup status, Pain points, Resource inventory]
    outputs: [Strategic advice, Action list, Risk warnings]
    uses_entities: [Organization, Goal]
    skill_ref: OPB/skills/strategic-planning-startup-mentor
  strategic-startup-simulator:
    name: Startup Simulator
    source: OPB
    desc: >-
      Use when the user wants to simulate startup scenarios, practise business decisions, evaluate a
      startup idea, or run scenario drills and get feedback. Covers (1) feasibility analysis of a
      proposed idea, (2) strategic decision points during the startup journey, (3) stress-testing a
      business model, (4) evaluating market positioning from a commercial angle before building a
      technical product. Trigger words: startup, business model, feasibility analysis, market
      validation, MVP, startup decision, business analysis.
    inputs: [Business assumptions, Market parameters]
    outputs: [Scenario walkthrough, Sensitivity analysis]
    uses_entities: [Organization, Project]
    skill_ref: OPB/skills/strategic-planning-startup-simulator
  personal-review:
    name: Periodic Review
    source: OPB
    desc: >-
      Review assistant - expert in periodic review and reflection. Covers (1) periodic reviews
      (daily / weekly / monthly / annual), (2) project retrospectives and lessons distilled,
      (3) achievement summaries and highlight extraction, (4) problem reflection and root-cause
      analysis, (5) experience capture and knowledge management, (6) improvement action planning,
      (7) failure analysis, (8) growth-trajectory tracking.
    inputs: [Period goals, Actual results]
    outputs: [Review report, Improvement items]
    uses_entities: [Goal, Task]
    skill_ref: OPB/skills/personal-growth-review-assistant
  personal-planning:
    name: Planning Assistant
    source: OPB
    desc: >-
      Planning assistant - expert in personal goal planning. Covers (1) long-range planning
      (annual / 3-year / 5-year / 10-year vision), (2) short-term plans (quarterly / monthly /
      weekly), (3) goal decomposition and execution path design, (4) prioritization and resource
      allocation, (5) plan adjustment, (6) OKR / goal-management system design, (7) project planning
      and milestones, (8) individual development plans (IDP).
